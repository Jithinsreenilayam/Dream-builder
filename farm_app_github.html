<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fin & Feather</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#f3f8f6;--card:#fff;--ink:#12231e;--mut:#5a6f68;--line:#dbe6e1;--brand:#0f766e;--brand2:#14b8a6;--onbrand:#fff;--accent:#f59e0b;--danger:#dc2626;--ok:#15803d;--soft:#e6f4ef;--warnbg:#fff4d6;--warnink:#7a5200;--shadow:0 2px 10px rgba(15,60,50,.09);--r:16px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0c1613;--card:#14231e;--ink:#e6f2ee;--mut:#98b2a9;--line:#25382f;--brand:#2dd4bf;--brand2:#14b8a6;--onbrand:#03201b;--soft:#173129;--warnbg:#3a2f0e;--warnink:#f5d98a;--shadow:0 2px 12px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg:#0c1613;--card:#14231e;--ink:#e6f2ee;--mut:#98b2a9;--line:#25382f;--brand:#2dd4bf;--brand2:#14b8a6;--onbrand:#03201b;--soft:#173129;--warnbg:#3a2f0e;--warnink:#f5d98a;--shadow:0 2px 12px rgba(0,0,0,.45)}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Malayalam",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--brand);text-decoration:none}
img{max-width:100%}
h1,h2,h3,p{margin:0}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
#hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
#hdr .wrap{display:flex;align-items:center;gap:10px;height:56px}
.logo{font-size:26px}
.bname{flex:1;min-width:0;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pillbtn{border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px;background:var(--card)}
.pillbtn.on{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
#pub{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:19;background:var(--warnbg);color:var(--warnink);border-bottom:1px solid var(--line);font-size:13px}
#pub .wrap{display:flex;align-items:center;gap:8px;padding-top:7px;padding-bottom:7px}
#pub .grow{flex:1}
#main{padding-top:14px;padding-bottom:150px}
.hero{border-radius:22px;padding:20px 18px;color:#fff;background:linear-gradient(135deg,#0f766e,#0e9aa7 60%,#38bdf8);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"🐠";position:absolute;right:-6px;bottom:-14px;font-size:96px;opacity:.16}
.hero h1{font-size:25px;line-height:1.25}
.hero p{opacity:.92;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{background:rgba(255,255,255,.2);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600}
.hbtns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--brand);color:var(--onbrand);text-align:center}
.btn.wa{background:#1fa855;color:#fff}
.btn.ghost{background:var(--card);color:var(--brand);border:1.5px solid var(--line)}
.btn.light{background:#fff;color:#0f5f58}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.block{display:flex;width:100%}
.btn.danger{background:var(--danger);color:#fff}
.btn[disabled]{opacity:.5;pointer-events:none}
.notice{margin-top:12px;background:var(--warnbg);color:var(--warnink);border-radius:12px;padding:10px 12px;font-size:14px}
.info{margin-top:12px;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px}
h2.sec{font-size:18px;margin:22px 2px 10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;text-align:left;display:block;width:100%}
.tile .m{height:96px;background:var(--soft);overflow:hidden}
.tile .m svg,.tile .m img{width:100%;height:100%;object-fit:cover;display:block}
.tile .t{padding:9px 12px 11px}
.tile b{display:block}
.tile span{color:var(--mut);font-size:13px}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity}
.hscroll .card{flex:0 0 150px;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}.tiles{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;position:relative;cursor:pointer}
.card .media{position:relative;aspect-ratio:8/5;background:var(--soft);overflow:hidden}
.card .media svg,.card .media img{width:100%;height:100%;object-fit:cover;display:block}
.ph{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:44px;background:linear-gradient(135deg,var(--soft),var(--card))}
.badge{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;line-height:1.5;color:#fff}
.b-in{background:#16a34a}.b-few{background:#f59e0b}.b-out{background:#dc2626}.b-soon{background:#2563eb}.b-order{background:#7c3aed}.b-now{background:#16a34a}
.card .media .badge{position:absolute;left:8px;top:8px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.card .body{padding:9px 11px 11px;display:flex;flex-direction:column;gap:2px;flex:1}
.card h3{font-size:14.5px;line-height:1.3}
.sub{color:var(--mut);font-size:12.5px}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;padding-top:6px}
.price{font-weight:800;font-size:16px;color:var(--brand);line-height:1.2}
.price small{display:block;font-weight:500;font-size:11.5px;color:var(--mut)}
.add{white-space:nowrap;background:var(--soft);color:var(--brand);font-weight:800;border-radius:10px;padding:6px 11px;font-size:13px}
.step{display:inline-flex;align-items:center;background:var(--brand);color:var(--onbrand);border-radius:10px;overflow:hidden}
.step button{width:30px;height:30px;font-size:18px;font-weight:800;color:inherit}
.step b{min-width:22px;text-align:center;font-size:14px}
.editbtn{position:absolute;right:6px;top:6px;background:#fff;color:#000;border-radius:50%;width:32px;height:32px;box-shadow:0 1px 5px rgba(0,0,0,.35);font-size:15px;z-index:2}
.tools{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:0 12px}
.search input{flex:1;border:0;background:none;color:inherit;font:inherit;padding:11px 0;outline:none;min-width:0}
.cats{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px}
.cats button{white-space:nowrap;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-weight:600;font-size:13.5px}
.cats button.on{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.ctrl label{display:flex;align-items:center;gap:6px}
select,input[type=text],input[type=number],input[type=time],textarea,input[type=email],input[type=tel]{font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
.ctrl select{width:auto}
textarea{resize:vertical;min-height:70px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
#bar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:25;pointer-events:none}
#bar .wrap{pointer-events:none}
.listbar{pointer-events:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#1fa855;color:#fff;border-radius:14px;padding:10px 14px;box-shadow:0 4px 16px rgba(0,0,0,.3);font-weight:700;width:100%}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav .wrap{display:flex;padding:0}
#nav button{flex:1;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:0;font-size:10.5px;font-weight:600;color:var(--mut);min-width:0}
#nav button span{font-size:21px;line-height:1.2}
#nav button.on{color:var(--brand)}
#nav button i{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.show{display:block}
#sheet .ov{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--card);border-radius:22px 22px 0 0;padding:0 0 calc(18px + env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.panel .x{position:sticky;top:8px;display:block;margin:8px 8px -42px auto;z-index:3;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:16px}
.panel .pm{aspect-ratio:8/5;background:var(--soft);overflow:hidden;border-radius:22px 22px 0 0}
.panel .pm svg,.panel .pm img{width:100%;height:100%;object-fit:cover;display:block}
.panel .pb{padding:14px 16px}
.panel h2{font-size:21px;line-height:1.3}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.badge.plain{background:var(--soft);color:var(--brand)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.fact{background:var(--soft);border-radius:12px;padding:8px 11px}
.fact small{display:block;color:var(--mut);font-size:11.5px}
.fact b{font-size:14px}
.tipbox{background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px}
.tipbox b{display:block;margin-bottom:2px}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.acts .btn{flex:1;min-width:130px}
.big{font-size:24px;font-weight:800;color:var(--brand)}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.li .n{flex:1;min-width:0}
.li .n small{display:block;color:var(--mut)}
.li .thumb{width:54px;height:40px;border-radius:8px;overflow:hidden;background:var(--soft);flex:none}
.li .thumb svg,.li .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.crow{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:9px;color:inherit}
.crow .ic{font-size:24px;width:38px;text-align:center}
.crow b{display:block}
.crow small{color:var(--mut)}
table.hrs{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
table.hrs td{padding:8px 14px;border-bottom:1px solid var(--line)}
table.hrs tr:last-child td{border:0}
table.hrs td:last-child{text-align:right;font-weight:600}
table.hrs tr.today{background:var(--soft)}
.card2{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
ul.tick{list-style:none;padding:0;margin:0}
ul.tick li{padding:5px 0 5px 26px;position:relative}
ul.tick li::before{content:"✓";position:absolute;left:2px;color:var(--brand);font-weight:800}
.field{margin:10px 0}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin-bottom:3px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photo{display:flex;align-items:center;gap:10px}
.photo .pv{width:96px;height:64px;border-radius:10px;overflow:hidden;background:var(--soft);flex:none}
.photo .pv svg,.photo .pv img{width:100%;height:100%;object-fit:cover}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:#111;color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center}
#toast.show{opacity:1}
.demo{background:#7c3aed;color:#fff;text-align:center;font-size:12.5px;padding:5px 10px;font-weight:600}
.hrow{display:grid;grid-template-columns:70px 1fr 1fr auto;gap:6px;align-items:center;margin:6px 0;font-size:13px}
.hrow input[type=time]{padding:6px}
.small{font-size:12.5px;color:var(--mut)}
.center{text-align:center}
.mt{margin-top:12px}

.big small{display:inline;font-size:16px}
.step{white-space:nowrap}
.acts.stick{position:sticky;bottom:-1px;background:var(--card);padding:10px 0 4px;margin-top:8px;border-top:1px solid var(--line)}
</style>
</head>

/* ---------- hours ---------- */
function fmtTime(s) { var p = String(s || '09:00').split(':'), h = +p[0], m = p[1] || '00', ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + m + ' ' + ap; }
function mins(s) { var p = String(s || '0:0').split(':'); return (+p[0]) * 60 + (+p[1] || 0); }
function openStatus() {
  var hrs = DATA.biz.hours || [], now = new Date(), d = now.getDay(), cur = now.getHours() * 60 + now.getMinutes(), h = hrs[d];
  if (h && !h.closed && cur >= mins(h.open) && cur < mins(h.close)) return { open: true, text: t('openNow').replace('{t}', fmtTime(h.close)) };
  for (var i = 0; i < 8; i++) {
    var dd = (d + i) % 7, x = hrs[dd]; if (!x || x.closed) continue;
    if (i === 0 && cur >= mins(x.open)) continue;

    return { open: false, text: t('closedNow').replace('{d}', dn).replace('{t}', fmtTime(x.open)) };
  }
  return { open: false, text: t('closed') };
}

  h += '<a class="crow" target="_blank" rel="noopener" href="' + esc(waLink(t('hello').replace('{b}', bizName()))) + '"><span class="ic">💬</span><div><b>' + t('wa') + '</b><small>+' + esc(waNum()) + '</small></div></a>';
  if (b.email) h += '<a class="crow" href="mailto:' + esc(b.email) + '"><span class="ic">✉️</span><div><b>' + t('mail') + '</b><small>' + esc(b.email) + '</small></div></a>';
  if (b.insta) h += '<a class="crow" target="_blank" rel="noopener" href="https://instagram.com/' + esc(String(b.insta).replace('@', '')) + '"><span class="ic">📷</span><div><b>' + t('insta') + '</b><small>@' + esc(String(b.insta).replace('@', '')) + '</small></div></a>';
  h += '<a class="crow" target="_blank" rel="noopener" href="' + esc(mapsUrl()) + '"><span class="ic">📍</span><div><b>' + t('dir') + '</b><small>' + esc(T(b.address)) + '</small></div></a>';
  var st = openStatus(), order = [1, 2, 3, 4, 5, 6, 0], today = new Date().getDay();
  h += '<h2 class="sec">🕒 ' + t('hours') + '</h2><div class="info" style="margin:0 0 8px">' + (st.open ? '🟢 ' : '🔴 ') + esc(st.text) + '</div><table class="hrs">' + order.map(function (d) {
    var x = (b.hours || [])[d] || { closed: true };
    return '<tr class="' + (d === today ? 'today' : '') + '"><td>' + L[lang].days[d] + '</td><td>' + (x.closed ? t('closed') : fmtTime(x.open) + ' – ' + fmtTime(x.close)) + '</td></tr>';
  }).join('') + '</table>';
  h += '<h2 class="sec">💬 ' + t('sendEnq') + '</h2><div class="card2"><div class="field"><label>' + t('yourName') + '</label><input type="text" id="enqName" value="' + esc(custName) + '"></div><div class="field"><label>' + t('yourMsg') + '</label><textarea id="enqMsg"></textarea></div><button class="btn wa block" data-enq>💬 ' + t('send') + '</button></div>';
  var rules = T(b.rules).split('\n').filter(Boolean);
  if (rules.length) h += '<h2 class="sec">🌿 ' + t('rules') + '</h2><div class="card2"><ul class="tick">' + rules.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ul></div>';
  h += '<button class="btn ghost block mt" data-share>🔗 ' + t('share') + '</button>';
  return h;
}

/* ---------- sheets ---------- */
function openSheet(html, cls) {
  var s = $('#sheet'); s.innerHTML = '<div class="ov" data-close></div><div class="panel ' + (cls || '') + '"><button class="x" data-close aria-label="Close">✕</button>' + html + '</div>';
  s.classList.add('show'); document.body.classList.add('noscroll');
}
function closeSheet() { var s = $('#sheet'); s.classList.remove('show'); s.innerHTML = ''; document.body.classList.remove('noscroll'); }

function openDetail(key) {
  var sec = key.split(':')[0], it = findItem(key); if (!it) return;
  var h = '<div class="pm">' + media(it, sec) + '</div><div class="pb"><h2>' + esc(T(it.name)) + '</h2><div class="badges">' + (it.stock ? badge(it) : '') + (catLabel(sec, it.cat) ? '<span class="badge plain">' + esc(catLabel(sec, it.cat)) + '</span>' : '') + '</div>';
  h += '<div class="big">' + priceHTML(it).replace('class="price"', '') + '</div>';
  var facts = SEC[sec].facts.filter(function (f) { return getp(it, f[1]); });
  if (facts.length) h += '<div class="facts">' + facts.map(function (f) { return '<div class="fact"><small>' + t(f[0]) + '</small><b>' + esc(factVal(f[1], it[f[1]])) + '</b></div>'; }).join('') + '</div>';
  if (T(it.desc)) h += '<p style="margin-top:8px">' + esc(T(it.desc)) + '</p>';
  if (T(it.tips)) h += '<div class="tipbox"><b>💡 ' + t('tips') + '</b>' + esc(T(it.tips)) + '</div>';
  h += '<div class="acts"><a class="btn wa" target="_blank" rel="noopener" href="' + esc(waLink(enquiryMsg(it, sec))) + '">💬 ' + t(sec === 'fun' ? 'book' : 'ask') + '</a>' + (it.stock === 'out' ? '' : ctl(key, 'btn ghost')) + '</div></div>';
  openSheet(h);
}
function openList() {
  var keys = Object.keys(list).filter(findItem), h = '<div class="pb"><h2>🧺 ' + t('myList') + '</h2>';
  if (!keys.length) { h += '<p class="small" style="margin:14px 0">' + t('emptyList') + '</p></div>'; openSheet(h, 'listpanel'); return; }
  keys.forEach(function (k) {
    var it = findItem(k), sec = k.split(':')[0];
    h += '<div class="li"><div class="thumb">' + media(it, sec) + '</div><div class="n"><b>' + esc(T(it.name)) + '</b><small>' + priceText(it) + '</small></div><span class="step"><button data-dec="' + k + '">−</button><b>' + list[k] + '</b><button data-inc="' + k + '">+</button></span></div>';
  });
  h += '<div class="li" style="border:0"><div class="n"><b>' + t('est') + '</b></div><div class="big">₹' + inr(listTotal()) + '</div></div><p class="small">' + t('priceNote') + '</p>';
  h += '<div class="field"><label>' + t('yourName') + '</label><input type="text" id="listName" value="' + esc(custName) + '"></div>';
  h += '<div class="acts"><a class="btn wa" id="sendList" target="_blank" rel="noopener" href="' + esc(waLink(listMsg())) + '">💬 ' + t('sendList') + '</a><button class="btn ghost" data-clearlist>' + t('clear') + '</button></div></div>';
  openSheet(h, 'listpanel');
}

/* ---------- events ---------- */
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-tab],[data-lang],[data-open],[data-add],[data-inc],[data-dec],[data-cat],[data-openlist],[data-clearlist],[data-close],[data-enq],[data-share]');
  if (!el) return;
  var d = el.dataset;
  if (d.tab !== undefined) { tab = d.tab; try { history.replaceState(null, '', '#' + tab); } catch (x) {} closeSheet(); render(); return; }
  if (d.lang !== undefined) { lang = lang === 'en' ? 'ml' : 'en'; store.set('ff_lang', lang); render(); return; }
  if (d.add !== undefined) { e.stopPropagation(); changeQty(d.add, 1); return; }
  if (d.inc !== undefined) { e.stopPropagation(); changeQty(d.inc, 1); return; }
  if (d.dec !== undefined) { e.stopPropagation(); changeQty(d.dec, -1); return; }
  if (d.open !== undefined) { openDetail(d.open); return; }
  if (d.cat !== undefined) { var c = d.cat.split(':'); FS[c[0]].cat = c[1]; render(); return; }
  if (d.openlist !== undefined) { openList(); return; }
  if (d.clearlist !== undefined) { list = {}; saveList(); refreshCtls(); closeSheet(); return; }
  if (d.close !== undefined) { closeSheet(); return; }
  if (d.enq !== undefined) {
    var nm = $('#enqName').value.trim(), ms = $('#enqMsg').value.trim(); custName = nm; store.set('ff_name', nm);
    var txt = 'Hello ' + bizName() + '! ' + (nm ? 'I am ' + nm + '. ' : '') + (ms || 'I would like to know more about your fish, birds and activities.');
    window.open(waLink(txt), '_blank', 'noopener'); return;
  }
  if (d.share !== undefined) {
    var url = ''; try { url = location.href.split('#')[0]; } catch (x) {}
    if (navigator.share) { navigator.share({ title: T(DATA.biz.name), text: T(DATA.biz.tagline), url: url }).catch(function () {}); }
    else if (navigator.clipboard && url) { navigator.clipboard.writeText(url).then(function () { toast(t('copied')); }).catch(function () { toast(url); }); }
    else toast(url || '—');
    return;
  }
});
document.addEventListener('input', function (e) {
  var el = e.target;
  if (el.hasAttribute && el.hasAttribute('data-q')) { var s = el.getAttribute('data-q'); FS[s].q = el.value; fillResults(s); }
  if (el.id === 'listName') { custName = el.value; store.set('ff_name', custName); var a = $('#sendList'); if (a) a.href = waLink(listMsg()); }
});
document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.hasAttribute('data-sort')) { var s = el.getAttribute('data-sort'); FS[s].sort = el.value; fillResults(s); }
  else if (el.hasAttribute('data-stock')) { var s2 = el.getAttribute('data-stock'); FS[s2].stock = el.checked; fillResults(s2); }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

/* ---------- start ---------- */
render();
})();
</script>
</body>
</html>
